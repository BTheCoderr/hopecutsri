<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-label="Hope Cuts RI logo">
  <defs>
    <linearGradient id="poleMetal" x1="0" x2="1">
      <stop offset="0" stop-color="#e9edf2"/>
      <stop offset="0.25" stop-color="#b8c0cc"/>
      <stop offset="0.5" stop-color="#f7f9fb"/>
      <stop offset="0.75" stop-color="#aab3bf"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <clipPath id="poleClip">
      <rect x="110" y="95" width="190" height="330" rx="42"/>
    </clipPath>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <rect x="95" y="55" width="220" height="70" rx="35" fill="url(#poleMetal)" stroke="#7b8594" stroke-width="6"/>
    <rect x="112" y="72" width="186" height="36" rx="18" fill="#d7dde6" opacity="0.7"/>
    <rect x="110" y="95" width="190" height="330" rx="42" fill="#ffffff" stroke="#7b8594" stroke-width="6"/>
    <g clip-path="url(#poleClip)">
      <g transform="rotate(-18 205 260)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="-60 0;-60 70" dur="1.5s" repeatCount="indefinite"/>
          <rect x="120" y="40" width="70" height="520" fill="#1E3A8A" opacity="0.95"/>
        <rect x="190" y="40" width="70" height="520" fill="#ffffff"/>
        <rect x="260" y="40" width="70" height="520" fill="#C41E3A" opacity="0.95"/>
        <rect x="330" y="40" width="70" height="520" fill="#ffffff"/>
        <rect x="400" y="40" width="70" height="520" fill="#1E3A8A" opacity="0.95"/>
        <rect x="470" y="40" width="70" height="520" fill="#ffffff"/>
        <rect x="540" y="40" width="70" height="520" fill="#C41E3A" opacity="0.95"/>
        </g>
      </g>
      <rect x="110" y="95" width="70" height="330" fill="#ffffff" opacity="0.22"/>
    </g>
    <rect x="95" y="400" width="220" height="70" rx="35" fill="url(#poleMetal)" stroke="#7b8594" stroke-width="6"/>
    <rect x="112" y="418" width="186" height="36" rx="18" fill="#d7dde6" opacity="0.7"/>
  </g>
  <g filter="url(#textShadow)">
    <text x="380" y="250" font-family="Impact, 'Arial Black', 'Montserrat', system-ui, sans-serif" font-size="170" font-weight="900" letter-spacing="4" fill="#C41E3A" stroke="#ffffff" stroke-width="14" paint-order="stroke">HOPE</text>
    <text x="392" y="264" font-family="Impact, 'Arial Black', 'Montserrat', system-ui, sans-serif" font-size="170" font-weight="900" letter-spacing="4" fill="#1E3A8A" opacity="0.95">HOPE</text>
    <text x="380" y="250" font-family="Impact, 'Arial Black', 'Montserrat', system-ui, sans-serif" font-size="170" font-weight="900" letter-spacing="4" fill="#C41E3A" stroke="#ffffff" stroke-width="14" paint-order="stroke">HOPE</text>
  </g>
  <g filter="url(#textShadow)">
    <text x="520" y="385" font-family="'Brush Script MT', 'Pacifico', 'Segoe Script', cursive" font-size="150" font-weight="700" fill="#1E3A8A" stroke="#ffffff" stroke-width="12" paint-order="stroke">Cutz</text>
  </g>
</svg>
